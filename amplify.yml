version: 1
applications:
  - frontend:
      phases:
        # 필드 전 준비 단계
        preBuild:
          commands:
            # Node.js 버전을 22로 설정
            - nvm install 22
            - nvm use 22
            # 의존 라이브러리 설치
            - npm ci
            # AWS Amplify 백엔드를 배포
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        build:
          commands:
            # 환경 변수 설정
            - env | grep -e CONFLUENCE_BASE_URL -e CONFLUENCE_API_TOKEN -e CONFLUENCE_USER_EMAIL -e GITHUB_TOKEN >> .env
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

